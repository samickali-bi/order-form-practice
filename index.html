<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>فرم ثبت سفارش</title>
  <style>
    * { box-sizing: border-box; font-family: Calibri, Arial, sans-serif; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px 14px;
      background: #a9dce7;
      color: #222;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }
    .sheet {
      width: 100%;
      max-width: 620px;
      padding: 28px;
      background: white;
      border: 2px solid #bcbcbc;
      box-shadow: 8px 8px 0 rgba(0, 0, 0, .08);
    }
    h1 { text-align: center; margin: 0 0 8px; }
    p { text-align: center; color: #666; line-height: 1.8; }
    label { display: block; margin: 18px 0 6px; font-weight: bold; }
    input {
      width: 100%;
      height: 42px;
      padding: 8px 10px;
      border: 1px solid #ccc;
      background: #f5f5f5;
      font-size: 16px;
    }
    input:focus { outline: 2px solid #2563eb; background: white; }
    button {
      width: 100%;
      margin-top: 24px;
      height: 46px;
      border: 0;
      border-radius: 6px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover { background: #1d4ed8; }
    #error { color: #b91c1c; display: none; text-align: center; }
  </style>
</head>
<body>
  <main class="sheet">
    <h1>فرم ثبت سفارش</h1>
    <p>لطفاً مشخصات سفارش خود را وارد کنید.</p>

    <form id="orderForm"
          method="POST"
          action="https://samickali.app.n8n.cloud/webhook/order-form-submit">

      <label for="customerName">نام مشتری</label>
      <input id="customerName" name="customerName" type="text" required>

      <label for="mobile">شماره موبایل</label>
      <input id="mobile" name="mobile" type="tel"
             inputmode="numeric" pattern="09[0-9]{9}"
             placeholder="09123456789" required>

      <label for="orderAmount">مبلغ سفارش (تومان)</label>
      <input id="orderAmount" name="orderAmount" type="number"
             min="1" step="1" placeholder="مثلاً 600000" required>

      <input id="telegramId" name="telegramId" type="hidden">

      <p id="error">لطفاً فرم را از لینک داخل بات تلگرام باز کنید.</p>
      <button type="submit">ثبت سفارش</button>
    </form>
  </main>

  <script>
    const chatId = new URLSearchParams(location.search).get("telegramId");
    const form = document.getElementById("orderForm");

    if (chatId && /^\d+$/.test(chatId)) {
      document.getElementById("telegramId").value = chatId;
    } else {
      document.getElementById("error").style.display = "block";
      form.querySelector("button").disabled = true;
    }
  </script>
</body>
</html>
